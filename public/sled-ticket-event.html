<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>눈썰매장 입장권 할인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .snow {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0.7;
    }
    @keyframes fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(600px) rotate(360deg); opacity: 0.2; }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-sky-500 to-blue-600 min-h-screen flex items-center justify-center p-4 overflow-hidden relative">
  <!-- Snow particles -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <script>
      for(let i = 0; i < 40; i++) {
        const snow = document.createElement('div');
        snow.className = 'snow';
        snow.style.left = Math.random() * 100 + '%';
        snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
        snow.style.animationDelay = Math.random() * 5 + 's';
        snow.style.width = (Math.random() * 6 + 3) + 'px';
        snow.style.height = snow.style.width;
        document.currentScript.parentElement.appendChild(snow);
      }
    </script>
  </div>

  <!-- Main Card -->
  <div class="relative bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden">
    <!-- Top Banner -->
    <div class="bg-gradient-to-r from-sky-500 to-blue-600 px-6 py-4 text-center">
      <p class="text-white/90 text-sm">초호펜션 이용고객 특별 혜택</p>
      <h1 class="text-2xl font-black text-white mt-1">눈썰매장 입장권 할인</h1>
    </div>

    <!-- Content -->
    <div class="px-6 py-6">
      <!-- Kids Sledding Illustration -->
      <div class="bg-gradient-to-br from-sky-50 to-blue-50 rounded-2xl p-6 mb-5 text-center">
        <div class="text-6xl mb-3">🛷</div>
        <div class="flex justify-center gap-2 text-4xl mb-4">
          <span>👧</span>
          <span>👦</span>
          <span>👶</span>
        </div>
        <p class="text-sky-700 font-bold text-lg">초리골 눈썰매장</p>
        <p class="text-sky-600 text-sm mt-1">아이들과 함께하는 겨울 추억!</p>
      </div>

      <!-- Benefits -->
      <div class="space-y-3 mb-5">
        <div class="flex items-center gap-3 bg-yellow-50 border border-yellow-200 rounded-xl p-4">
          <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-xl">🎫</div>
          <div>
            <p class="font-bold text-yellow-800">할인된 가격</p>
            <p class="text-sm text-yellow-700">입장권을 특별가로 구매</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-blue-50 border border-blue-200 rounded-xl p-4">
          <div class="w-10 h-10 bg-blue-400 rounded-full flex items-center justify-center text-xl">📞</div>
          <div>
            <p class="font-bold text-blue-800">간편한 신청</p>
            <p class="text-sm text-blue-700">관리자 연락 또는 예약시 신청</p>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div class="bg-gradient-to-r from-sky-500 to-blue-600 rounded-2xl p-4 text-center text-white">
        <p class="text-sm opacity-90 mb-1">문의 및 신청</p>
        <p class="text-xl font-bold">010-7932-0029</p>
      </div>

      <!-- Footer -->
      <div class="mt-4 text-center text-gray-500 text-xs">
        초호펜션 | 초리골 눈썰매장
      </div>
    </div>
  </div>
</body>
</html>
