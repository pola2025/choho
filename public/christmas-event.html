<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크리스마스 이벤트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .snow {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(600px) rotate(360deg); opacity: 0.3; }
    }
    .sparkle {
      animation: sparkle 1.5s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-red-800 via-red-700 to-green-800 min-h-screen flex items-center justify-center p-4 overflow-hidden relative">
  <!-- Snow particles -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <script>
      for(let i = 0; i < 50; i++) {
        const snow = document.createElement('div');
        snow.className = 'snow';
        snow.style.left = Math.random() * 100 + '%';
        snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
        snow.style.animationDelay = Math.random() * 5 + 's';
        snow.style.width = (Math.random() * 8 + 4) + 'px';
        snow.style.height = snow.style.width;
        document.currentScript.parentElement.appendChild(snow);
      }
    </script>
  </div>

  <!-- Main Card -->
  <div class="relative bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden">
    <!-- Top Decoration -->
    <div class="bg-gradient-to-r from-red-600 via-red-500 to-green-600 h-3"></div>

    <!-- Header -->
    <div class="relative bg-gradient-to-b from-red-50 to-white px-6 pt-8 pb-4 text-center">
      <!-- Christmas ornaments -->
      <div class="absolute top-2 left-4 text-4xl sparkle">🎄</div>
      <div class="absolute top-2 right-4 text-4xl sparkle" style="animation-delay: 0.5s;">🎅</div>

      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-red-100 text-red-700 rounded-full text-sm font-bold mb-4">
        <span>🎁</span> SPECIAL EVENT
      </div>

      <h1 class="text-3xl font-black text-red-700 mb-2">
        Merry Christmas!
      </h1>
      <p class="text-gray-600 text-sm">초리골164 베이커리 카페</p>
    </div>

    <!-- Content -->
    <div class="px-6 py-6">
      <!-- Event Info -->
      <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-5 border-2 border-green-200 mb-5">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl flex items-center justify-center text-3xl shadow-lg">
            🦙
          </div>
          <div>
            <p class="text-green-800 font-bold text-lg">알파카 미니피규어</p>
            <p class="text-green-600 text-sm">키링 증정!</p>
          </div>
        </div>

        <div class="space-y-3">
          <div class="flex items-start gap-2">
            <span class="text-xl">🎄</span>
            <p class="text-gray-700 text-sm leading-relaxed">
              <strong class="text-green-800">크리스마스</strong>에<br/>
              초리골164 베이커리 카페<br/>
              이용고객님께 제공해드립니다.
            </p>
          </div>

          <div class="bg-white/60 rounded-xl p-3 border border-green-200">
            <p class="text-center text-green-800 font-bold">
              1인 1개 한정!
            </p>
          </div>
        </div>
      </div>

      <!-- Date Badge -->
      <div class="bg-gradient-to-r from-red-500 to-red-600 rounded-2xl p-4 text-center text-white mb-5">
        <p class="text-sm opacity-90 mb-1">이벤트 기간</p>
        <p class="text-2xl font-black">12월 25일 (수)</p>
        <p class="text-xs opacity-80 mt-1">선착순 소진시 종료</p>
      </div>

      <!-- Footer Note -->
      <div class="flex items-center justify-center gap-2 text-gray-500 text-xs">
        <span>🏔️</span>
        <span>초리골164 베이커리 카페 | 초호펜션</span>
        <span>🏔️</span>
      </div>
    </div>

    <!-- Bottom Decoration -->
    <div class="bg-gradient-to-r from-green-600 via-red-500 to-green-600 h-3"></div>
  </div>
</body>
</html>
