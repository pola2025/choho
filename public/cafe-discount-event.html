<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 음료 10% 할인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .snow {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0.6;
    }
    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 1; }
      100% { transform: translateY(600px); opacity: 0.2; }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-amber-500 via-orange-500 to-orange-600 min-h-screen flex items-center justify-center p-4 overflow-hidden relative">
  <!-- Snow particles -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <script>
      for(let i = 0; i < 30; i++) {
        const snow = document.createElement('div');
        snow.className = 'snow';
        snow.style.left = Math.random() * 100 + '%';
        snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
        snow.style.animationDelay = Math.random() * 5 + 's';
        snow.style.width = (Math.random() * 6 + 3) + 'px';
        snow.style.height = snow.style.width;
        document.currentScript.parentElement.appendChild(snow);
      }
    </script>
  </div>

  <!-- Main Card -->
  <div class="relative bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden">
    <!-- Top Banner -->
    <div class="bg-gradient-to-r from-amber-500 to-orange-600 px-6 py-4 text-center">
      <p class="text-white/90 text-sm">눈썰매장 팔찌 지참시</p>
      <h1 class="text-2xl font-black text-white mt-1">카페 음료 10% 할인</h1>
    </div>

    <!-- Content -->
    <div class="px-6 py-6">
      <!-- Illustration -->
      <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-6 mb-5 text-center">
        <div class="flex justify-center gap-3 text-5xl mb-3">
          <span>☕</span>
          <span>🧋</span>
        </div>
        <div class="flex justify-center items-center gap-2 mb-3">
          <span class="text-3xl">🛷</span>
          <span class="text-2xl">➡️</span>
          <span class="text-3xl">☕</span>
        </div>
        <p class="text-orange-700 font-bold text-lg">초리골164 베이커리 카페</p>
        <p class="text-orange-600 text-sm mt-1">따뜻한 음료로 몸을 녹이세요!</p>
      </div>

      <!-- How it works -->
      <div class="space-y-3 mb-5">
        <div className="text-center mb-4">
          <span className="inline-block px-4 py-1 bg-amber-100 text-amber-700 rounded-full text-sm font-bold">
            이용 방법
          </span>
        </div>
        <div class="flex items-center gap-3 bg-sky-50 border border-sky-200 rounded-xl p-4">
          <div class="w-10 h-10 bg-sky-400 rounded-full flex items-center justify-center text-xl">🎿</div>
          <div>
            <p class="font-bold text-sky-800">STEP 1</p>
            <p class="text-sm text-sky-700">눈썰매장에서 팔찌 받기</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-orange-50 border border-orange-200 rounded-xl p-4">
          <div class="w-10 h-10 bg-orange-400 rounded-full flex items-center justify-center text-xl">☕</div>
          <div>
            <p class="font-bold text-orange-800">STEP 2</p>
            <p class="text-sm text-orange-700">카페에서 팔찌 보여주기</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl p-4">
          <div class="w-10 h-10 bg-green-400 rounded-full flex items-center justify-center text-xl">💰</div>
          <div>
            <p class="font-bold text-green-800">STEP 3</p>
            <p class="text-sm text-green-700">음료&커피 10% 할인 받기!</p>
          </div>
        </div>
      </div>

      <!-- Discount Badge -->
      <div class="bg-gradient-to-r from-amber-500 to-orange-600 rounded-2xl p-4 text-center text-white">
        <p class="text-4xl font-black">10% 할인</p>
        <p class="text-sm opacity-90 mt-1">모든 음료 & 커피</p>
      </div>

      <!-- Footer -->
      <div class="mt-4 text-center text-gray-500 text-xs">
        초리골164 베이커리 카페 | 초리골 눈썰매장
      </div>
    </div>
  </div>
</body>
</html>
