<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title>입실시간 안내</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 800px;
      height: 800px;
    }

    body {
      width: 800px;
      height: 800px;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 50%, #A5D6A7 100%);
      position: relative;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      z-index: 10;
    }

    /* 상단 배지 */
    .badge {
      background: #FF5722;
      color: white;
      padding: 12px 35px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 35px;
      box-shadow: 0 4px 15px rgba(255,87,34,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* 시계 아이콘 */
    .clock-icon {
      font-size: 120px;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
    }

    /* 메인 타이틀 */
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #2E7D32;
      text-align: center;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    /* 시간 강조 */
    .time-highlight {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      background: white;
      padding: 20px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      margin-bottom: 30px;
    }

    .time-text {
      font-size: 56px;
      font-weight: 900;
      color: #D32F2F;
    }

    .time-label {
      font-size: 24px;
      color: #666;
      font-weight: 600;
    }

    /* 경고 박스 */
    .warning-box {
      background: #FFF3E0;
      border: 3px solid #FF9800;
      border-radius: 20px;
      padding: 30px 45px;
      text-align: center;
      max-width: 620px;
    }

    .warning-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .warning-text {
      font-size: 28px;
      color: #E65100;
      font-weight: 700;
      line-height: 1.5;
    }

    .sub-text {
      font-size: 20px;
      color: #666;
      margin-top: 15px;
      font-weight: 500;
    }

    /* 연락처 */
    .contact-box {
      margin-top: 25px;
      background: white;
      padding: 15px 35px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .contact-icon {
      font-size: 28px;
    }

    .contact-number {
      font-size: 26px;
      font-weight: 700;
      color: #2E7D32;
    }

    /* 로고 */
    .logo {
      position: absolute;
      bottom: 30px;
      right: 40px;
      font-size: 24px;
      font-weight: 800;
      color: #2E7D32;
    }

    /* 장식 */
    .deco {
      position: absolute;
      font-size: 60px;
      opacity: 0.15;
    }

    .deco-1 { top: 50px; left: 40px; }
    .deco-2 { top: 80px; right: 60px; }
    .deco-3 { bottom: 120px; left: 50px; }
    .deco-4 { bottom: 100px; right: 80px; }
  </style>
</head>
<body>
  <!-- 장식 -->
  <span class="deco deco-1">🏠</span>
  <span class="deco deco-2">🌲</span>
  <span class="deco deco-3">🌲</span>
  <span class="deco deco-4">🏠</span>

  <div class="container">
    <div class="badge">📢 공지</div>

    <div class="clock-icon">🕕</div>

    <h1 class="title">입실시간 안내</h1>

    <div class="time-highlight">
      <span class="time-text">18:00</span>
      <span class="time-label">이후 입실 시</span>
    </div>

    <div class="warning-box">
      <div class="warning-icon">⚠️</div>
      <p class="warning-text">
        관리자 사전 연락 필수!
      </p>
      <p class="sub-text">
        저녁 6시 이후 입실 예정이신 고객님께서는<br>
        반드시 사전에 연락 부탁드립니다.
      </p>
    </div>

    <div class="contact-box">
      <span class="contact-icon">📞</span>
      <span class="contact-number">031-584-8377</span>
    </div>

    <div class="logo">초호펜션</div>
  </div>
</body>
</html>
