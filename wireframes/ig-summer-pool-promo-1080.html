<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>시원한 여름 프로모션 — 인스타 4:5 소재 (1080×1350)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
        background: #0f172a;
        margin: 0;
      }
      .serif {
        font-family: "Noto Serif KR", serif;
      }
      .ig {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <!--
      인스타 피드용 4:5 소재.
      상세 이용조건(사전신청·주간야간 택1·야간개장·평상 등)은 피드에서 잘 안 읽히므로
      이미지에 넣지 않고 캡션으로만 전달한다. 이미지는 혜택 한 덩어리만 크게.
    -->
    <div class="ig relative">
      <img
        src="../public/images/pool/pool-real-water.png"
        alt=""
        class="absolute inset-0 w-full h-full object-cover"
      />
      <div
        class="absolute inset-0"
        style="
          background: linear-gradient(
            180deg,
            rgba(6, 42, 68, 0.72) 0%,
            rgba(6, 42, 68, 0.26) 18%,
            rgba(6, 42, 68, 0.34) 46%,
            rgba(3, 28, 48, 0.9) 80%,
            rgba(3, 24, 42, 0.96) 100%
          );
        "
      ></div>

      <div
        class="relative h-full flex flex-col items-center justify-center text-center px-12 py-12"
      >
        <!-- 브랜드 -->
        <p class="text-white/80 tracking-[0.45em] text-[17px] font-semibold mb-4">
          CHOHO&nbsp;PENSION
        </p>
        <div
          class="inline-flex items-center bg-white/15 backdrop-blur-md border border-white/25 rounded-full px-12 py-3.5"
        >
          <span class="text-white text-[38px] font-bold tracking-tight">시원한 여름 프로모션</span>
        </div>
        <p class="text-cyan-200 text-[27px] font-semibold mt-4 num">
          8월 3일(월) ~ 8월 16일(일) 입실 고객
        </p>

        <!-- 티켓 -->
        <div class="w-full mt-9">
          <div class="bg-white rounded-[40px] shadow-2xl w-full relative px-16 pt-12 pb-12">
            <p class="text-cyan-600 text-[18px] font-bold tracking-[0.35em] mb-3">
              ADMISSION&nbsp;TICKET
            </p>
            <h3 class="serif text-stone-800 font-black text-[44px] leading-tight">
              더초리골 수영장 무료입장권
            </h3>

            <!-- '2'와 '매' 동일 크기 / 우측 FREE+무료입장 스택 높이 = '2매' 높이 -->
            <div class="flex items-center justify-center gap-9 mt-6">
              <span
                class="serif font-black text-cyan-600 num"
                style="font-size: 172px; line-height: 0.76"
                >2매</span
              >
              <div class="text-left">
                <p
                  class="text-cyan-500 font-black tracking-wide"
                  style="font-size: 93px; line-height: 0.86"
                >
                  FREE
                </p>
                <p class="text-stone-500 font-bold" style="font-size: 70px; line-height: 1.05">
                  무료 입장
                </p>
              </div>
            </div>

            <div class="relative my-9">
              <div class="border-t-2 border-dashed border-cyan-200"></div>
              <span
                class="absolute -left-16 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-[#0d3a5c]"
              ></span>
              <span
                class="absolute -right-16 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-[#0d3a5c]"
              ></span>
            </div>

            <div class="flex items-center justify-center gap-5">
              <span class="text-stone-300 font-black text-[58px] leading-none">+</span>
              <p class="text-stone-700 text-[38px] font-bold leading-snug">
                추가 인원은 <span class="text-cyan-600 font-black text-[48px] num">50%</span> 할인권
              </p>
            </div>
            <p class="text-stone-400 text-[23px] mt-3">
              객실 이용인원 기준 · 무료 2매를 제외한 나머지 인원
            </p>

            <div class="mt-9 bg-cyan-50/70 border border-cyan-100 rounded-3xl px-10 py-7 text-left">
              <p class="text-cyan-700 text-[19px] font-bold tracking-[0.2em] mb-4">이용 예시</p>
              <div class="flex items-center gap-5 text-[26px] text-stone-700">
                <span class="w-[185px] shrink-0 font-bold text-stone-800">Forest 4인</span>
                <span class="text-stone-300">→</span>
                <span
                  >무료 <b class="text-cyan-700">2매</b> + 50% 할인
                  <b class="text-cyan-700">2매</b></span
                >
              </div>
              <div
                class="flex items-center gap-5 text-[26px] text-stone-700 mt-3.5 pt-3.5 border-t border-cyan-100"
              >
                <span class="w-[185px] shrink-0 font-bold text-stone-800">호수뷰 6인</span>
                <span class="text-stone-300">→</span>
                <span
                  >무료 <b class="text-cyan-700">2매</b> + 50% 할인
                  <b class="text-cyan-700">4매</b></span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- 상세 조건은 캡션으로 -->
        <p class="text-white/85 text-[25px] font-semibold mt-8">
          객실 예약 시 <b class="text-white">사전 신청 필수</b>
          <span class="text-white/45 mx-2">·</span>
          <span class="text-cyan-200">자세한 안내는 캡션 확인</span>
        </p>
      </div>
    </div>
  </body>
</html>
